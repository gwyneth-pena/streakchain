<div class="notes-section">
  <div class="row mt-3 mt-md-0 mb-3">
    <div class="col-md-12 d-flex justify-content-end">
      <button class="btn btn-outline-primary add-note-btn" (click)="openSaveNoteModal()">
        <i class="ti ti-plus me-2"></i> Add Note
      </button>
    </div>
  </div>

  <div class="note-board rounded-4 border-0 shadow-sm p-3 p-md-4">
    <div class="row g-3">
      @for (note of notes(); track note.id) {
        <div class="col-12 col-md-6 col-xl-4">
          <div class="note h-100 rounded-4 p-3">
            <p class="mb-3">{{ note.text }}</p>
            <div class="d-flex justify-content-between align-items-center gap-2 mt-auto">
              <small class="text-muted">{{ note.updated_at | date : 'medium' }}</small>
              <div class="d-flex align-items-center">
                <i class="ti ti-pencil me-2 pointer" (click)="openSaveNoteModal(note)"></i>
                <i class="ti ti-trash pointer" (click)="deleteNote(note)"></i>
              </div>
            </div>
          </div>
        </div>
      }
    </div>

    @if (!notes()) {
      <div class="text-center py-4 text-muted">
        <i class="ti ti-loader-2 me-2"></i> Loading...
      </div>
    }

    @if (notes()?.length === 0) {
      <div class="text-center py-4 text-muted">
        <i class="ti ti-note me-2"></i> No notes yet. Add one to start capturing ideas.
      </div>
    }
  </div>
</div>
